<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brandspec</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/assets/studio.css" />
  </head>
  <body>
    <div id="studio-shell" class="studio-shell">
      <header class="topbar">
        <div class="topbar-left">
          <img class="brand-logo" src="/assets/logo.svg" alt="Brandspec" width="28" height="28" />
          <nav class="breadcrumbs" aria-label="Workspace path">
            <span class="crumb-strong">Brandspec</span>
            <span class="crumb-sep">/</span>
            <span id="session-dir" class="crumb-muted"></span>
          </nav>
        </div>

        <div class="topbar-right">
          <div id="mode-tabs" class="segmented" hidden>
            <button type="button" class="seg-btn is-active" data-tab="review">Design</button>
            <button type="button" class="seg-btn" data-tab="mockups">Mockup</button>
          </div>
        </div>
      </header>

      <div id="review-workspace" class="workspace">
        <aside class="tool-rail" aria-label="Sidebar and workspace controls">
          <button type="button" class="rail-btn is-active" id="rail-candidates" title="Candidates panel" data-sidebar="candidates">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
              <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
              <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
              <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
          <button type="button" class="rail-btn" id="rail-history" title="Round history log" data-sidebar="history">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3" />
              <path d="M8 4.8V8.2L10.3 9.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span id="history-pending-dot" class="rail-dot" hidden aria-label="Pending agent response"></span>
          </button>
          <div class="rail-spacer"></div>
          <button type="button" class="rail-btn" id="rail-toggle-left" title="Toggle left panel">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <rect x="2" y="2.5" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3" />
              <path d="M6 2.5V13.5" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
          <button type="button" class="rail-btn" id="rail-fullscreen" title="Fullscreen canvas (hide sidebars)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2.5 6V2.5H6M10 2.5H13.5V6M13.5 10V13.5H10M6 13.5H2.5V10" stroke="currentColor" stroke-width="1.3" />
            </svg>
          </button>
        </aside>

        <aside id="left-sidebar" class="left-sidebar">
          <div class="sidebar-head">
            <span id="sidebar-heading" class="sidebar-title">Candidates</span>
          </div>

          <div id="candidates-panel-body" class="candidate-scroll"></div>

          <div id="history-panel-body" class="candidate-scroll" hidden>
            <div id="history-log-list" class="history-log-list"></div>
          </div>
        </aside>

        <main class="canvas-stage">
          <div class="floating-toolbar" role="toolbar" aria-label="Stage view controls">
            <div class="tool-seg" role="group" aria-label="Render mode">
              <button type="button" class="tool-btn is-active" data-view="positive">Positive</button>
              <button type="button" class="tool-btn" data-view="inverted">Inverted</button>
              <button type="button" class="tool-btn" data-view="grid">Grid</button>
              <button type="button" class="tool-btn" data-view="sheet">Sheet</button>
            </div>
            <span class="tool-divider"></span>
            <div class="tool-seg" role="group" aria-label="Scale test">
              <button type="button" class="tool-btn is-active" data-scale="fit">Fit</button>
              <button type="button" class="tool-btn tabular" data-scale="96">96px</button>
              <button type="button" class="tool-btn tabular" data-scale="48">48px</button>
              <button type="button" class="tool-btn tabular" data-scale="24">24px</button>
            </div>
            <span class="tool-divider"></span>
            <div class="zoom-group">
              <button type="button" class="tool-btn" id="zoom-out" aria-label="Zoom out">-</button>
              <button type="button" class="tool-btn zoom-label tabular" id="zoom-reset" title="Reset zoom to 100%">100%</button>
              <button type="button" class="tool-btn" id="zoom-in" aria-label="Zoom in">+</button>
            </div>
            <span class="tool-divider"></span>
            <label class="hex-box" for="surface-hex" title="Custom background hex">
              <span id="hex-swatch" class="hex-swatch"></span>
              <input id="surface-hex" type="text" value="" placeholder="#ffffff" maxlength="7" />
            </label>
          </div>

          <div id="canvas-viewport" class="canvas-viewport">
            <div id="artboard-wrap" class="artboard-wrap">
              <div id="canvas-frame" class="canvas-frame">
                <img id="mark-image" alt="Compiled brand mark" draggable="false" />
                <div id="pin-layer" class="pin-layer"></div>
              </div>
            </div>
          </div>

          <div id="hover-coords" class="hover-coords tabular" hidden>0.00, 0.00</div>
          <div id="metrics-dock" class="telemetry-dock"></div>
        </main>

        <aside id="right-inspector" class="inspector">
          <div class="inspector-section">
            <div class="inspector-head">
              <h1 id="candidate-title">Mark Review</h1>
              <p id="candidate-subtitle" class="inspector-sub"></p>
            </div>
          </div>

          <div class="inspector-section">
            <div class="section-label-row">
              <span class="section-label">Decision</span>
            </div>
            <div class="decision-grid" role="group" aria-label="Review decision">
              <button type="button" class="decision-btn" data-status="approve">
                <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M2.8 8.4L6.2 11.8L13.2 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Approve</span>
              </button>
              <button type="button" class="decision-btn is-active" data-status="revise">
                <svg width="6" height="12" viewBox="0 0 6 14" fill="none" aria-hidden="true">
                  <path d="M3 2V8.2M3 11.4V11.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span>Revise</span>
              </button>
              <button type="button" class="decision-btn" data-status="reject">
                <svg width="11" height="11" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                  <path d="M3 3L11 11M11 3L3 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                <span>Reject</span>
              </button>
            </div>
          </div>

          <div class="inspector-section" id="fill-section">
            <div class="section-label-row">
              <span class="section-label">Fill &amp; Gradient</span>
              <div class="fill-mode-seg" role="group" aria-label="Fill mode">
                <button type="button" class="fill-mode-btn is-active" data-fill-mode="solid">Solid</button>
                <button type="button" class="fill-mode-btn" data-fill-mode="linear">Linear</button>
                <button type="button" class="fill-mode-btn" data-fill-mode="radial">Radial</button>
              </div>
            </div>

            <div id="fill-solid-panel" class="fill-panel">
              <div class="fill-color-row">
                <input type="color" id="fill-solid-picker" value="#000000" aria-label="Solid fill color" />
                <input type="text" id="fill-solid-hex" value="#000000" maxlength="7" spellcheck="false" aria-label="Solid fill hex" />
              </div>
            </div>

            <div id="fill-gradient-panel" class="fill-panel" hidden>
              <div id="grad-bar-wrap" class="grad-bar-wrap" title="Click bar to add stop; click handle to select">
                <div id="grad-bar" class="grad-bar"></div>
                <div id="grad-handles" class="grad-handles"></div>
              </div>
              <div id="grad-angle-row" class="grad-angle-row">
                <span class="fill-sub-label">Angle</span>
                <input type="range" id="grad-angle-range" min="0" max="360" step="1" value="0" />
                <span id="grad-angle-val" class="tabular fill-sub-val">0°</span>
              </div>
              <div class="fill-color-row">
                <input type="color" id="grad-stop-picker" value="#000000" aria-label="Selected stop color" />
                <input type="text" id="grad-stop-hex" value="#000000" maxlength="7" spellcheck="false" aria-label="Selected stop hex" />
                <span id="grad-stop-offset" class="tabular fill-sub-val">0%</span>
                <button type="button" id="grad-remove-stop" class="text-btn" title="Remove selected stop">Remove</button>
              </div>
            </div>

            <div class="fill-actions-row">
              <button type="button" id="fill-apply-btn" class="btn-secondary">Apply Fill</button>
              <span id="fill-status" class="fill-status"></span>
            </div>
          </div>

          <div class="inspector-section inspector-pins">
            <div class="section-label-row">
              <span class="section-label">Pin Comments <span id="pin-count" class="tabular">(0)</span></span>
              <button type="button" id="clear-pins" class="text-btn" hidden>Clear all</button>
            </div>
            <div id="pin-list" class="pin-list"></div>
          </div>

          <div class="inspector-section">
            <label class="section-label" for="review-summary">Review Summary</label>
            <textarea id="review-summary" rows="3" placeholder="Write targeted revision or sign-off notes..."></textarea>
            <button type="button" id="submit-review" class="btn-primary">Submit Review</button>
            <div id="submit-error" class="submit-error" hidden></div>
          </div>

          <div class="inspector-accordions">
            <details id="warnings-accordion" class="accordion" hidden>
              <summary>
                <span>Audit Warnings</span>
                <span id="warnings-count" class="tabular">0</span>
              </summary>
              <div id="warnings-list" class="accordion-body"></div>
            </details>
          </div>
        </aside>
      </div>

      <section id="mockups-panel" class="mockups-workspace" hidden>
        <div class="mockups-inner">
          <div class="mockups-header">
            <div>
              <h2>Brand Mockups</h2>
              <p>Deterministic perspective scenes composited from the active candidate</p>
            </div>
            <div class="mockups-controls">
              <input id="mockup-brand-name" type="text" placeholder="Brand name" aria-label="Brand name" />
              <input id="mockup-headline" type="text" placeholder="Headline" aria-label="Headline" />
              <input id="mockup-website" type="text" placeholder="Website" aria-label="Website" />
              <input id="mockup-accent" type="color" value="#2563eb" title="Brand accent" aria-label="Brand accent" />
              <button type="button" id="mockup-render-btn" class="btn-secondary">Render Mockups</button>
            </div>
          </div>
          <div id="mockups-status" class="mockups-status" hidden></div>
          <div id="mockups-grid" class="mockups-grid"></div>
        </div>
      </section>
    </div>

    <script src="/assets/studio.js" defer></script>
  </body>
</html>
