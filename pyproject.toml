[project]
name = "brandspec"
version = "0.1.0"
description = "Deterministic brand mark compiler and visual audit CLI"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Rafif Muchsin", email = "rafif@rafifmsn.com" },
]
requires-python = ">=3.11,<3.14"
keywords = [
    "brand",
    "logo",
    "svg",
    "vector",
    "modernism",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
    "fontTools>=4.50",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.7",
    "resvg-py>=0.2",
    "skia-pathops>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/rafifmsn/brandspec"
Repository = "https://github.com/rafifmsn/brandspec"
Issues = "https://github.com/rafifmsn/brandspec/issues"

[project.scripts]
brandspec = "brandspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brandspec"]

[tool.hatch.build.targets.wheel.force-include]
"skills/brandspec/SKILL.md" = "brandspec/skills/SKILL.md"
